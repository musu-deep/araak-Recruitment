<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة توظيف اراك</title><style>body{margin:0;background:#f3f8f5;font-family:system-ui;text-align:center;padding:15vh 20px;color:#123c31}.spin{width:42px;height:42px;border:4px solid #d9e9e1;border-top-color:#167555;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="spin"></div><p>جارٍ تشغيل بوابة التوظيف…</p><script>(async()=>{try{const fs=['chunks/c0.txt','chunks/c1.txt','chunks/c2.txt','chunks/c3.txt','chunks/c4.txt'],b=(await Promise.all(fs.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.text()})))).join(''),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),h=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<h2>تعذر تشغيل البوابة</h2><p>يرجى إعادة تحميل الصفحة أو استخدام متصفح حديث.</p>';console.error(e)}})();</script></body></html>
