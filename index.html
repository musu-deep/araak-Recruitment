<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#167555"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"><title>بوابة توظيف اراك</title><style>body{margin:0;background:#f3f8f5;font-family:system-ui;text-align:center;padding:15vh 20px;color:#123c31}.spin{width:42px;height:42px;border:4px solid #d9e9e1;border-top-color:#167555;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:620px;margin:auto;line-height:1.8}</style></head><body><div class="spin"></div><p>جارٍ تشغيل بوابة التوظيف…</p><script>(async()=>{try{const root=location.hostname.endsWith('github.io')?'/araak-Recruitment/':'/';const files=['chunks/c0.txt','chunks/c1.txt','chunks/c2a.txt','chunks/c2b.txt','chunks/c3.txt','chunks/c4.txt'];const parts=await Promise.all(files.map(async path=>{const url=root+path;const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(url+' returned '+response.status);return response.text()}));const bytes=Uint8Array.from(atob(parts.join('')),char=>char.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Browser does not support DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('<h1>خطوتك المهنية<br><em>نحو أثرٍ أكبر</em></h1>','<h1>نموذج<br><em>طلب توظيف خارجي</em></h1>');document.open();document.write(html);document.close()}catch(error){document.body.innerHTML='<div class="err"><h2>تعذر تشغيل بوابة التوظيف</h2><p>حدث خطأ أثناء تحميل ملفات التطبيق. أعد تحميل الصفحة بعد اكتمال آخر نشر.</p><pre style="white-space:pre-wrap;direction:ltr;text-align:left">'+String(error)+'</pre></div>';console.error(error)}})();</script></body></html>
