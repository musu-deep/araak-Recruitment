services:
  - type: web
    name: araak-recruitment
    runtime: static
    branch: main
    buildCommand: node scripts/verify-bundle.mjs && node scripts/build-config.mjs
    staticPublishPath: .
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: employment-attachments
      - key: PROCESS_FUNCTION
        value: process-recruitment-submission
      - key: PARSE_FUNCTION
        value: parse-cv
      - key: ODOO_RECRUITMENT_ALIAS
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
